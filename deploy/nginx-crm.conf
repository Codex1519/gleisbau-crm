# vHost für den System-nginx auf dem Server.
# Domain: gleisbau-crm.duckdns.org (DuckDNS → 89.167.118.97)
#
# Setup-Ablauf (siehe DEPLOY.md für Details):
#   1. DuckDNS: current ip = 89.167.118.97 eintragen
#   2. Datei nach /etc/nginx/sites-available/crm kopieren
#      ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. HTTPS (Let's Encrypt, kostenlos, Auto-Renewal):
#      apt install certbot python3-certbot-nginx
#      certbot --nginx -d gleisbau-crm.duckdns.org
#      → Certbot ergänzt den 443-Block + HTTP→HTTPS-Umleitung automatisch.

server {
    listen 80;
    server_name gleisbau-crm.duckdns.org;

    # Größere Uploads (CSV-Import etc.) zulassen
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
